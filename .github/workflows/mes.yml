name: MES validation and container publication
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  windows-desktop:
    needs: mes
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - name: Check MES desktop identity and data boundaries
        run: node --test tests/desktop-identity.test.cjs
      - name: Build Windows MES desktop backend and assets
        run: npm run desktop:prepare
      - name: Package unpacked Windows MES desktop app
        run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: forgeflow-mes-windows-${{ github.sha }}
          path: outputs/desktop/win-unpacked/
          if-no-files-found: error
          retention-days: 7

  mes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Verify offline MES database migration using synthetic SQLite files
        run: node --test tests/migration/mes-go-db.test.mjs
      - run: go -C backend test -race -timeout=20m ./...
      - run: npm run web:build
      - name: Build MES image
        run: docker build --build-arg SUITE_RELEASE_SHA=${GITHUB_SHA} -f infra/linux/Dockerfile.station -t mes-ci:${GITHUB_SHA} .
      - name: Smoke-test isolated MES image
        run: |
          set -euo pipefail
          docker run -d --name mes-ci -p 127.0.0.1:18095:8095 mes-ci:${GITHUB_SHA}
          trap 'docker logs mes-ci; docker rm -f mes-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health | python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert d["data"]["revision"] == os.environ["GITHUB_SHA"], d'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/erp/login)" = 404
      - name: Verify isolated deployment and rollback
        run: bash infra/linux/test-mes-deployment.sh
      - name: Verify gateway archive handling
        run: python3 infra/linux/test-mes-gateway.py
      - name: Verify deployment workflow boundary contract
        run: python3 infra/linux/test-mes-workflow-contract.py
      - name: Verify OCI rootless provisioner boundary contract
        run: python3 infra/linux/test-mes-provisioner-contract.py

  rootless-host-provisioning:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Replace Docker only inside disposable ARM64 runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          # DISPOSABLE ARM64 runner only: hosted runners ship Docker 28; replace it only in this VM.
          runner_docker_packages=()
          for package in docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin docker.io docker.io-app docker-compose-v2; do
            if dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null | grep -qx installed; then
              runner_docker_packages+=("$package")
            fi
          done
          if ((${#runner_docker_packages[@]})); then
            sudo systemctl stop docker.service docker.socket 2>/dev/null || true
            sudo apt-get remove -y --purge "${runner_docker_packages[@]}"
          fi
          sudo apt-get install -y --no-install-recommends docker.io=29.1.3-0ubuntu3~24.04.2 docker-compose-v2
          sudo systemctl enable --now docker.service
          test "$(dpkg-query -W -f='${Version}' docker.io)" = '29.1.3-0ubuntu3~24.04.2'
          test "$(docker info --format '{{.ServerVersion}}')" = '29.1.3'
          docker compose version --short
      - name: Prepare SSH parser for the forced-command acceptance check
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
      - name: Provision rootless MES beside an unchanged rootful Docker sentinel
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          engine_version="$(docker info --format '{{.ServerVersion}}')"
          [[ "$engine_version" == 29.* ]] || { echo "Expected existing rootful Docker 29.x, got $engine_version" >&2; exit 1; }
          rootful_ids="$(docker ps -aq)"
          sentinel="mes-provisioner-rootful-sentinel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="mes-provisioner-rootful-volume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_dir="/tmp/mes-provisioning-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          port_probe_log="/tmp/mes-provisioning-port-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          port_check_log="/tmp/mes-provisioning-port-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          port_probe_pid=''
          [[ "$sentinel" =~ ^mes-provisioner-rootful-sentinel-[0-9]+-[0-9]+$ ]]
          [[ "$volume" =~ ^mes-provisioner-rootful-volume-[0-9]+-[0-9]+$ ]]
          [[ "$source_dir" =~ ^/tmp/mes-provisioning-[0-9]+-[0-9]+$ ]]
          ! docker inspect "$sentinel" >/dev/null 2>&1
          ! docker volume inspect "$volume" >/dev/null 2>&1
          [[ ! -e /srv/business-suite && ! -L /srv/business-suite ]]
          cleanup() {
            local failed_status=$?
            if (( failed_status != 0 )); then
              for diagnostic in "$port_check_log" "$port_probe_log"; do
                if [[ -f "$diagnostic" && ! -L "$diagnostic" ]]; then tail -n 100 -- "$diagnostic" >&2; fi
              done
            fi
            if [[ -n "$port_probe_pid" ]]; then kill "$port_probe_pid" >/dev/null 2>&1 || true; fi
            docker rm -f "$sentinel" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            rm -f -- "$port_probe_log" "$port_check_log"
            if [[ -d "$source_dir" && ! -L "$source_dir" && "$(realpath -e -- "$source_dir")" == "$source_dir" ]]; then
              rm -rf -- "$source_dir"
            fi
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --detach --name "$sentinel" --volume "$volume:/data" alpine:3.21 sh -c 'printf preserved >/data/sentinel; exec sleep 3600' >/dev/null
          sentinel_id="$(docker inspect --format '{{.Id}}' "$sentinel")"
          echo 'Prove unmanaged port conflicts are rejected'
          python3 -m http.server 18095 --bind 127.0.0.1 >"$port_probe_log" 2>&1 &
          port_probe_pid=$!
          for attempt in $(seq 1 20); do
            if ss -H -ltn 'sport = :18095' | grep -q .; then break; fi
            sleep 0.25
          done
          ss -H -ltn 'sport = :18095' | grep -q .
          if sudo bash infra/linux/provision-mes-rootless-host.sh --check >"$port_check_log" 2>&1; then
            echo 'Unmanaged host accepted an unrelated listener on the MES port' >&2
            exit 1
          fi
          grep -Fq 'TCP port 18095 is already in use on an unmanaged host' "$port_check_log"
          kill "$port_probe_pid"
          wait "$port_probe_pid" 2>/dev/null || true
          port_probe_pid=''
          ! ss -H -ltn 'sport = :18095' | grep -q .
          sudo install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" /srv/business-suite
          printf 'portfolio sentinel\n' | sudo tee /srv/business-suite/provisioner-ci-sentinel >/dev/null
          sudo bash infra/linux/provision-mes-rootless-host.sh --check
          sudo bash infra/linux/provision-mes-rootless-host.sh --apply
          # A second apply must audit and return without disrupting either daemon.
          sudo bash infra/linux/provision-mes-rootless-host.sh --apply
          sudo bash infra/linux/provision-mes-rootless-host.sh --check
          sudo bash infra/linux/test-mes-host-isolation.sh
          sudo -u mes-runtime -- git clone --no-hardlinks "$GITHUB_WORKSPACE" "$source_dir"
          sudo -u mes-runtime -- git -C "$source_dir" checkout --detach "$GITHUB_SHA"
          runtime_uid="$(id -u mes-runtime)"
          sudo -u mes-runtime -- env \
            HOME="$(getent passwd mes-runtime | cut -d: -f6)" \
            XDG_RUNTIME_DIR="/run/user/$runtime_uid" \
            DOCKER_HOST="unix:///run/user/$runtime_uid/docker.sock" \
            bash -c 'cd "$1" && exec bash infra/linux/test-mes-deployment.sh' _ "$source_dir"
          echo 'Deploy MES on its owned production port, then audit it'
          release_archive="/srv/business-suite-mes/staging/$GITHUB_SHA.tgz"
          sudo -u mes-runtime -- bash -c 'set -Eeuo pipefail; cd "$1"; git archive --format=tar "$2" | gzip -n > "$3"' _ "$source_dir" "$GITHUB_SHA" "$release_archive"
          release_digest="$(sha256sum "$release_archive" | cut -d' ' -f1)"
          sudo -u mes-runtime -- env \
            HOME=/var/lib/mes-runtime \
            XDG_RUNTIME_DIR="/run/user/$runtime_uid" \
            DOCKER_HOST="unix:///run/user/$runtime_uid/docker.sock" \
            bash -c 'cd "$1"; MES_REQUIRE_ROOTLESS_DOCKER=1 bash infra/linux/deploy-mes-release.sh "$2" "$3" "$4"' _ "$source_dir" "$GITHUB_SHA" "$release_digest" "$release_archive"
          curl --fail --silent --show-error http://127.0.0.1:18095/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True and d["data"]["status"] == "ready", d'
          sudo bash infra/linux/provision-mes-rootless-host.sh --check
          echo 'Prove managed port conflicts are rejected'
          managed_container="$(sudo -u mes-runtime -- env HOME=/var/lib/mes-runtime XDG_RUNTIME_DIR="/run/user/$runtime_uid" DOCKER_HOST="unix:///run/user/$runtime_uid/docker.sock" /usr/bin/docker ps -q --filter label=com.docker.compose.project=business-suite-mes --filter status=running)"
          [[ "$(wc -w <<<"$managed_container" | tr -d ' ')" == 1 ]]
          sudo -u mes-runtime -- env HOME=/var/lib/mes-runtime XDG_RUNTIME_DIR="/run/user/$runtime_uid" DOCKER_HOST="unix:///run/user/$runtime_uid/docker.sock" /usr/bin/docker stop "$managed_container" >/dev/null
          python3 -m http.server 18095 --bind 127.0.0.1 >"$port_probe_log" 2>&1 &
          port_probe_pid=$!
          for attempt in $(seq 1 20); do
            if ss -H -ltn 'sport = :18095' | grep -q .; then break; fi
            sleep 0.25
          done
          ss -H -ltn 'sport = :18095' | grep -q .
          if sudo bash infra/linux/provision-mes-rootless-host.sh --check >"$port_check_log" 2>&1; then
            echo 'Managed host accepted an unrelated listener on the MES port' >&2
            exit 1
          fi
          grep -Fq 'TCP port 18095 is occupied without exactly one managed MES container' "$port_check_log"
          kill "$port_probe_pid"
          wait "$port_probe_pid" 2>/dev/null || true
          port_probe_pid=''
          sudo -u mes-runtime -- env HOME=/var/lib/mes-runtime XDG_RUNTIME_DIR="/run/user/$runtime_uid" DOCKER_HOST="unix:///run/user/$runtime_uid/docker.sock" /usr/bin/docker start "$managed_container" >/dev/null
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:18095/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] is True and d["data"]["status"] == "ready", d'
          sudo bash infra/linux/provision-mes-rootless-host.sh --check
          sudo bash infra/linux/provision-mes-rootless-host.sh --apply
          [[ "$(docker info --format '{{.ServerVersion}}')" == "$engine_version" ]]
          [[ "$(docker ps --filter "name=^/${sentinel}$" --format '{{.ID}}')" == "${sentinel_id:0:12}" ]]
          docker exec "$sentinel" test "$(docker exec "$sentinel" cat /data/sentinel)" = preserved
          [[ "$(docker volume inspect --format '{{.Name}}' "$volume")" == "$volume" ]]

  release:
    needs: [mes, windows-desktop, rootless-host-provisioning]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify main head before release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha | grep -Fx "$GITHUB_SHA"
      - name: Package exact main source for deployment
        run: |
          set -euo pipefail
          mkdir -p deploy-artifact
          git archive --format=tar "$GITHUB_SHA" | gzip -n > deploy-artifact/mes-source.tgz
          (cd deploy-artifact && sha256sum mes-source.tgz > mes-source.tgz.sha256)
          printf '%s\n' "$GITHUB_SHA" > deploy-artifact/commit.sha
      - uses: actions/upload-artifact@v4
        with:
          name: mes-release-${{ github.sha }}
          path: deploy-artifact/
          retention-days: 1
          if-no-files-found: error
      - name: Publish MES image after all platform builds
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-mes"
          docker build --build-arg SUITE_RELEASE_SHA=${GITHUB_SHA} -f infra/linux/Dockerfile.station -t "$image:${GITHUB_SHA}" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:${GITHUB_SHA}"

  deploy:
    needs: [mes, windows-desktop, rootless-host-provisioning, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mes-production
    concurrency:
      group: mes-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mes-release-${{ github.sha }}
          path: deploy-artifact
      - name: Verify main head and artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(cat deploy-artifact/commit.sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha | grep -Fx "$GITHUB_SHA"
          (cd deploy-artifact && sha256sum --check mes-source.tgz.sha256)
      - name: Configure dedicated MES SSH access
        env:
          MES_DEPLOY_KEY: ${{ secrets.MES_DEPLOY_KEY }}
          MES_DEPLOY_HOST_KEY: ${{ secrets.MES_DEPLOY_HOST_KEY }}
          MES_DEPLOY_TARGET: ${{ secrets.MES_DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          [[ "$MES_DEPLOY_TARGET" =~ ^[a-z_][a-zA-Z0-9_-]*@([a-zA-Z0-9.-]+|\[[0-9a-fA-F:]+\])$ ]]
          [[ "$MES_DEPLOY_KEY" == *"BEGIN"* && -n "$MES_DEPLOY_HOST_KEY" ]]
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$MES_DEPLOY_KEY" > "$HOME/.ssh/mes_deploy_key"
          printf '%s\n' "$MES_DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/mes_deploy_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host mes-production
            HostName ${MES_DEPLOY_TARGET#*@}
            User ${MES_DEPLOY_TARGET%@*}
            IdentityFile ~/.ssh/mes_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path.home() / '.ssh/config'
          value = p.read_text().replace('${MES_DEPLOY_TARGET#*@}', os.environ['MES_DEPLOY_TARGET'].split('@', 1)[1]).replace('${MES_DEPLOY_TARGET%@*}', os.environ['MES_DEPLOY_TARGET'].split('@', 1)[0])
          p.write_text(value)
          PY
      - name: Verify the fixed remote deployment gateway
        run: |
          set -euo pipefail
          status="$(ssh -F "$HOME/.ssh/config" -T mes-production status)"
          printf '%s' "$status" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d == {"protocol":1,"ready":True,"runtime_user":"mes-runtime","docker_mode":"rootless","project":"business-suite-mes","data_volume":"business-suite-mes-station-data","port":"127.0.0.1:18095"}'
      - name: Deploy isolated MES release through the forced command
        run: |
          set -euo pipefail
          digest="$(sha256sum deploy-artifact/mes-source.tgz | cut -d' ' -f1)"
          ssh -F "$HOME/.ssh/config" -T mes-production "deploy $GITHUB_SHA $digest" \
            < deploy-artifact/mes-source.tgz
